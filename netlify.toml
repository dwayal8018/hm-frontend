# Netlify config for the frontend-only DEMO build.
# This file sits at the root of the deployed repo (the `hm-frontend` repo,
# whose root IS this Angular project). No `base` is set, so Netlify builds
# from the repo root.
[build]
  command = "npm ci && npm run build:demo"
  publish = "dist/frontend"

# SPA fallback so deep links (e.g. /billing/1001) resolve to the Angular app.
# Also covered by the _redirects file; kept here as a safety net.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
