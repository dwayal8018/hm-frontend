<h2 mat-dialog-title>{{ isEdit ? 'Edit Category' : 'Add Category' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Category Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g. Starters, Beverages">
      <mat-error>Name is required (min 2 characters)</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Category Type</mat-label>
      <mat-select formControlName="categoryType">
        @for (ct of categoryTypes; track ct.value) {
          <mat-option [value]="ct.value">
            <mat-icon style="font-size:18px;vertical-align:middle;margin-right:8px">{{ ct.icon }}</mat-icon>
            {{ ct.label }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Display Order</mat-label>
      <input matInput formControlName="displayOrder" type="number" min="0">
      <mat-hint>Lower number = shown first</mat-hint>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()" [disabled]="saving">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()"
          [disabled]="form.invalid || saving">
    @if (saving) { <mat-spinner diameter="18" style="display:inline-block;margin-right:6px"></mat-spinner> }
    {{ isEdit ? 'Save Changes' : 'Add Category' }}
  </button>
</mat-dialog-actions>
