<div class="settings-subpage">
  <div class="subpage-header">
    <button mat-icon-button routerLink="/settings" aria-label="Back">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2>Restaurant Profile</h2>
  </div>

  @if (loading) { <mat-progress-bar mode="indeterminate"></mat-progress-bar> }

  <mat-card class="form-card">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="save()" class="profile-form">

        <div class="section-label">Restaurant Info</div>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Restaurant Name</mat-label>
          <input matInput formControlName="restaurantName">
          <mat-icon matSuffix>store</mat-icon>
          <mat-error>Required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Address</mat-label>
          <textarea matInput formControlName="address" rows="2"></textarea>
          <mat-icon matSuffix>location_on</mat-icon>
        </mat-form-field>

        <div class="row-2col">
          <mat-form-field appearance="outline" class="flex-1">
            <mat-label>Phone</mat-label>
            <input matInput formControlName="phone">
            <mat-icon matSuffix>phone</mat-icon>
            <mat-error>Required</mat-error>
          </mat-form-field>
          <mat-form-field appearance="outline" class="flex-1">
            <mat-label>UPI ID</mat-label>
            <input matInput formControlName="upiId" placeholder="name@upi">
            <mat-icon matSuffix>payment</mat-icon>
          </mat-form-field>
        </div>

        <div class="row-2col">
          <mat-form-field appearance="outline" class="flex-1">
            <mat-label>GST Number</mat-label>
            <input matInput formControlName="gstNumber" placeholder="29ABCDE1234F1Z5">
            <mat-icon matSuffix>receipt_long</mat-icon>
          </mat-form-field>
          <mat-form-field appearance="outline" class="flex-1">
            <mat-label>Logo URL</mat-label>
            <input matInput formControlName="logoUrl" placeholder="https://...">
            <mat-icon matSuffix>image</mat-icon>
          </mat-form-field>
        </div>

        <div class="section-label mt-16">Owner Info</div>
        <div class="row-2col">
          <mat-form-field appearance="outline" class="flex-1">
            <mat-label>Owner Name</mat-label>
            <input matInput formControlName="ownerName">
            <mat-icon matSuffix>badge</mat-icon>
            <mat-error>Required</mat-error>
          </mat-form-field>
          <mat-form-field appearance="outline" class="flex-1">
            <mat-label>Owner Email</mat-label>
            <input matInput formControlName="ownerEmail" type="email">
            <mat-icon matSuffix>email</mat-icon>
            <mat-error>Valid email required</mat-error>
          </mat-form-field>
        </div>

        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit"
                  [disabled]="form.invalid || saving || loading">
            @if (saving) { <mat-spinner diameter="18" style="display:inline-block;margin-right:6px"></mat-spinner> }
            Save Changes
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
